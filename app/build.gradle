apply plugin: 'com.android.application'

// ---- IDs (match your manifest/strings) ----
def appName = "camera_mixed_reality"
def application_id = "com.magicleap.capi.sample." + appName

android {
    namespace "com.magicleap.capi.sample.camera_mixed_reality"
    compileSdk 33
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.magicleap.capi.sample.camera_mixed_reality"
        minSdkVersion 29
        targetSdk 33
        // Build one universal debug APK with both ABIs:
        ndk { abiFilters "arm64-v8a", "x86_64" }
        externalNativeBuild {
            cmake { arguments "-DANDROID_STL=c++_static" }
        }
    }

    // No ABI splits (prevents “split APKs not compatible” errors)
    splits { abi { enable false } }

    buildTypes {
        debug  { ndk { debugSymbolLevel "FULL" }  }
        release{
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel "SYMBOL_TABLE" }
        }
    }

    // If you still want flavors, you can drop them for debug or keep them only for release.
    // (Safest is to remove productFlavors while testing.)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            version '3.22.1+'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }
}

dependencies {
//    implementation project(':models')                     // <-- pulls model assets in
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
}
